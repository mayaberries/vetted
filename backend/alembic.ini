# A generic, single database configuration.
[alembic]
# path to migration scripts
script_location = ./app/db/migrations
# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path
version_locations = ./app/db/migrations/versions
path_separator = os
# kalens' own chain (`alembic -n kalens ...`), read from the installed
# package. Its tables are still created by the chain above, so this one is
# only ever stamped, never upgraded -- see docs/architecture.md. No
# sqlalchemy.url: callers pass KALENS_DATABASE_URL, see the Makefile.
[kalens]
script_location = kalens:migrations
path_separator = os
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S