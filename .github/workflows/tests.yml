name: Backend & Admin Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run backend tests
      run: make test-be-docker

    - name: Tear down
      if: always()
      run: make test-be-docker-down

  admin-tests:
    name: Admin dashboard tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install admin dependencies
      run: make test-admin-install

    - name: Run admin unit tests
      run: make test-admin-unit

    - name: Run admin end-to-end tests
      run: make test-admin-e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/admin/playwright-report/
        retention-days: 30
