<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pets Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!-- Static prototype: no backend, no network calls, all data below is hardcoded.
     Same CDN Tailwind build as frontend/template/src/layouts/BaseLayout.astro. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: "#F1F3EE", ink: "#172E29", inksoft: "#4B5D58", surface: "#FFFFFF",
          line: "#DCE1D9", gold: "#E3A039", goldsoft: "#F7DBA6", teal: "#3F7377",
          panel: "#F7F9F4", muted: "#4B5D58",
          primary: { DEFAULT: "#3F7377", dark: "#2F5A5D" },
          accent: { DEFAULT: "#E3A039", dark: "#C1841F", light: "#F7DBA6" },
        },
        fontFamily: {
          display: ['"Space Grotesk"', "sans-serif"],
          body: ['"Inter"', "sans-serif"],
          sans: ['"Inter"', "sans-serif"],
          mono: ['"IBM Plex Mono"', "monospace"],
        },
      },
    },
  };
</script>
<style>
  body { font-family: "Inter", sans-serif; }
  .badge { display:inline-flex; align-items:center; gap:.35rem; font-size:.75rem; font-weight:600; padding:.15rem .6rem; border-radius:9999px; }
  .badge-ok { background:#DCEFE0; color:#1E6B3A; }
  .badge-warn { background:#F7DBA6; color:#7A4E0F; }
  .badge-off { background:#EDEFEA; color:#6B7A75; }
  ::selection { background:#e3a039; color:#172e29; }
</style>
</head>
<body class="bg-base text-ink font-body antialiased min-h-screen">

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm bg-surface border border-line rounded-2xl p-8">
    <div class="flex items-center gap-2 mb-6">
      <span class="w-7 h-7 rounded-full bg-teal flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-gold"><circle cx="12" cy="12" r="10"/></svg>
      </span>
      <span class="font-display font-700 text-lg tracking-tight text-ink">Pets Admin</span>
    </div>

    <label class="block text-xs font-medium text-inksoft mb-1.5">Email</label>
    <input id="login-email" type="email" autocomplete="username"
      class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

    <label class="block text-xs font-medium text-inksoft mb-1.5">Password</label>
    <input id="login-password" type="password" autocomplete="current-password"
      class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

    <button id="login-btn" onclick="handleLoginSubmit()"
      class="w-full bg-ink hover:bg-[#0f211d] text-white font-display font-600 text-sm px-4 py-3 rounded-full transition-colors">
      Sign in
    </button>
    <p id="login-error" class="text-sm text-red-600 mt-3 hidden"></p>

    <div class="flex items-center gap-3 my-5">
      <div class="h-px bg-line flex-1"></div>
      <span class="text-xs text-inksoft font-mono">or jump straight in</span>
      <div class="h-px bg-line flex-1"></div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <button onclick="loginAs('superadmin')"
        class="border border-line hover:border-teal text-ink text-xs font-medium px-3 py-2.5 rounded-lg transition-colors">
        Superadmin view
      </button>
      <button onclick="loginAs('clinic_admin')"
        class="border border-line hover:border-teal text-ink text-xs font-medium px-3 py-2.5 rounded-lg transition-colors">
        Clinic admin view
      </button>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="hidden min-h-screen">
  <header class="sticky top-0 z-40 bg-base/90 backdrop-blur border-b border-line">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 font-display font-700 text-lg tracking-tight text-ink">
        <span class="w-7 h-7 rounded-full bg-teal flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-gold"><circle cx="12" cy="12" r="10"/></svg>
        </span>
        Pets Admin
        <span id="role-badge" class="badge badge-ok ml-2"></span>
      </div>
      <div class="flex items-center gap-4 text-sm text-inksoft">
        <span id="user-email" class="font-mono"></span>
        <button onclick="logout()" class="text-ink font-medium hover:text-teal transition-colors">Sign out</button>
      </div>
    </div>
    <nav id="tab-nav" class="max-w-6xl mx-auto px-6 flex gap-6 text-sm font-medium text-inksoft border-t border-line/0"></nav>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div id="toast" class="hidden mb-4 text-sm rounded-lg px-4 py-3 border"></div>
    <div id="view-root"></div>
  </main>
</div>

<script>
/* =========================================================================
   STATE — everything below lives only in memory for this tab. No fetch(),
   no localStorage, no backend. Refreshing the page resets it.
   ========================================================================= */
const state = {
  me: null,
  tab: null,
  clinics: [],
  services: [],
  keys: [],
  sitesRegistry: {},
  appointmentsByService: {},
};

function showToast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "mb-4 text-sm rounded-lg px-4 py-3 border " +
    (kind === "ok" ? "bg-[#DCEFE0] border-[#1E6B3A]/20 text-[#1E6B3A]" : "bg-red-50 border-red-200 text-red-700");
  el.classList.remove("hidden");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.add("hidden"), 5000);
}

/* =========================================================================
   AUTH — no credential check against anything. The only validation is that
   both fields are filled in.
   ========================================================================= */
function handleLoginSubmit() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.classList.add("hidden");

  if (!email || !password) {
    errEl.textContent = "Email and password are required.";
    errEl.classList.remove("hidden");
    return;
  }

  loginAs("clinic_admin", email);
}

function loginAs(role, email) {
  seedData(role, email);
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
  document.getElementById("user-email").textContent = state.me.email;

  const roleBadge = document.getElementById("role-badge");
  if (state.me.is_superuser) {
    roleBadge.textContent = "Superadmin";
    roleBadge.className = "badge badge-warn ml-2";
  } else {
    roleBadge.textContent = state.me.role || "staff";
    roleBadge.className = "badge badge-ok ml-2";
  }

  buildTabs();
  renderTab();
}

function logout() {
  state.me = null;
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("login-email").value = "";
  document.getElementById("login-password").value = "";
  document.getElementById("login-error").classList.add("hidden");
}

/* =========================================================================
   HARDCODED DATA
   ========================================================================= */
function uid(prefix) { return `${prefix}-${Math.random().toString(36).slice(2, 8)}`; }

function seedData(role, email) {
  const now = Date.now();
  const inHours = (h) => new Date(now + h * 3600_000).toISOString();

  if (role === "superadmin") {
    state.me = {
      email: email || "superadmin@petsadmin.dev", username: "superadmin",
      is_superuser: true, role: null, clinic_id: null,
    };
    state.clinics = [
      { id: "demo-clinic-1", name: "Acme Vet Clinic", slug: "acme-vet", email: "hi@acmevet.dev", phone_number: "555-0100", created_at: inHours(-800) },
      { id: "demo-clinic-2", name: "Northside Animal Hospital", slug: "northside-animal", email: "hello@northside.dev", phone_number: "555-0142", created_at: inHours(-300) },
      { id: "demo-clinic-3", name: "Furry Friends Pet Care", slug: "furry-friends", email: "contact@furryfriends.dev", phone_number: "555-0177", created_at: inHours(-40) },
    ];
    state.sitesRegistry = {
      "demo-clinic-1": { built: true, last_built_at: inHours(-20), site_url: "https://acme-vet.example.com" },
      "demo-clinic-2": { built: false },
      "demo-clinic-3": { built: false },
    };
    state.services = [];
    state.appointmentsByService = {};
    state.keys = [];
  } else {
    const svc1 = uid("svc"), svc2 = uid("svc");
    state.me = {
      email: email || "admin@acmevet.dev", username: "clinic-admin",
      is_superuser: false, role: "clinic_admin", clinic_id: "demo-clinic-1",
    };
    state.clinics = [];
    state.services = [
      { id: svc1, name: "Wellness Exam", description: "Annual checkup and vaccinations.", category: "wellness_exam", duration_minutes: 30, price: 65 },
      { id: svc2, name: "Nail Trim", description: "Quick nail trim, walk-ins welcome.", category: "nail_trim", duration_minutes: 15, price: 20 },
    ];
    state.appointmentsByService = {
      [svc1]: [
        { id: uid("appt"), start_time: inHours(2), status: "requested" },
        { id: uid("appt"), start_time: inHours(26), status: "confirmed" },
        { id: uid("appt"), start_time: inHours(-30), status: "cancelled" },
      ],
      [svc2]: [
        { id: uid("appt"), start_time: inHours(4), status: "requested" },
      ],
    };
    state.keys = [
      { id: uid("key"), public_key: "pk_live_5f8a2c9d1e3b", label: "Website widget", environment: "live", is_active: true },
      { id: uid("key"), public_key: "pk_test_a1b2c3d4e5f6", label: "Local testing", environment: "test", is_active: false },
    ];
    state.sitesRegistry = {
      "demo-clinic-1": { built: false },
    };
  }
}

/* =========================================================================
   TABS
   ========================================================================= */
function tabsForRole() {
  if (state.me.is_superuser) return [["clinics", "Clinics"], ["account", "Account"]];
  return [
    ["overview", "Overview"],
    ["appointments", "Appointments"],
    ["services", "Services"],
    ["keys", "API Keys"],
    ["website", "Website"],
    ["account", "Account"],
  ];
}

function buildTabs() {
  const tabs = tabsForRole();
  state.tab = tabs[0][0];
  const nav = document.getElementById("tab-nav");
  nav.innerHTML = tabs.map(([id, label]) =>
    `<button data-tab="${id}" onclick="setTab('${id}')" class="tab-btn py-3 border-b-2 border-transparent hover:text-ink transition-colors">${label}</button>`
  ).join("");
  highlightTab();
}

function highlightTab() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const active = btn.dataset.tab === state.tab;
    btn.classList.toggle("border-teal", active);
    btn.classList.toggle("text-ink", active);
    btn.classList.toggle("font-semibold", active);
  });
}

function setTab(id) {
  state.tab = id;
  highlightTab();
  renderTab();
}

function renderTab() {
  const root = document.getElementById("view-root");
  try {
    if (state.tab === "account") return renderAccount();
    if (state.me.is_superuser) return renderSuperadmin();
    if (state.tab === "overview") return renderOverview();
    if (state.tab === "appointments") return renderAppointments();
    if (state.tab === "services") return renderServices();
    if (state.tab === "keys") return renderKeys();
    if (state.tab === "website") return renderWebsite(state.me.clinic_id);
  } catch (e) {
    root.innerHTML = `<p class="text-sm text-red-600">Error: ${e.message}</p>`;
  }
}

/* =========================================================================
   SUPERADMIN: CLINICS + LAUNCH SITE
   ========================================================================= */
function renderSuperadmin() {
  const root = document.getElementById("view-root");

  root.innerHTML = `
    <div class="flex items-end justify-between mb-6">
      <h1 class="font-display font-700 text-2xl text-ink">Clinics</h1>
      <p class="text-sm text-inksoft font-mono">${state.clinics.length} total</p>
    </div>
    <div class="grid gap-4" id="clinics-list"></div>
  `;

  const list = document.getElementById("clinics-list");
  for (const clinic of state.clinics) {
    const card = document.createElement("div");
    card.className = "bg-surface border border-line rounded-2xl p-5";
    card.innerHTML = `
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="font-display font-600 text-ink">${clinic.name}</p>
          <p class="text-xs text-inksoft font-mono">${clinic.slug} · ${clinic.id}</p>
        </div>
        <div class="flex items-center gap-3">
          <span id="site-badge-${clinic.id}" class="badge badge-off"></span>
          <button onclick="openLaunchPanel('${clinic.id}')"
            class="bg-gold hover:bg-[#d1922f] text-ink font-display font-600 text-xs px-4 py-2 rounded-full transition-colors">
            Launch / rebuild site
          </button>
        </div>
      </div>
      <div id="launch-panel-${clinic.id}" class="hidden mt-4 pt-4 border-t border-line"></div>
    `;
    list.appendChild(card);
    refreshSiteBadge(clinic);
  }
}

function refreshSiteBadge(clinic) {
  const badge = document.getElementById(`site-badge-${clinic.id}`);
  const status = state.sitesRegistry[clinic.id] || { built: false };
  if (status.built) {
    badge.textContent = "live · built " + new Date(status.last_built_at).toLocaleString();
    badge.className = "badge badge-ok";
  } else {
    badge.textContent = "not built yet";
    badge.className = "badge badge-off";
  }
}

function openLaunchPanel(clinicId) {
  const panel = document.getElementById(`launch-panel-${clinicId}`);
  const wasOpen = !panel.classList.contains("hidden");
  document.querySelectorAll('[id^="launch-panel-"]').forEach(p => p.classList.add("hidden"));
  if (wasOpen) return;
  panel.classList.remove("hidden");
  panel.innerHTML = launchFormHTML(clinicId);
}

function launchFormHTML(clinicId) {
  return `
    <div class="grid sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-inksoft mb-1">Site URL (optional, where it'll be hosted)</label>
        <input id="launch-siteurl-${clinicId}" placeholder="https://acme-vet.example.com" class="w-full rounded-lg border border-line px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-inksoft mb-1">Brand color (optional)</label>
        <input id="launch-color-${clinicId}" placeholder="#3F7377" class="w-full rounded-lg border border-line px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-inksoft mb-1">Logo URL (optional)</label>
        <input id="launch-logo-${clinicId}" class="w-full rounded-lg border border-line px-3 py-2 text-sm" />
      </div>
    </div>
    <button onclick="launchSite('${clinicId}')" id="launch-btn-${clinicId}"
      class="mt-4 bg-ink hover:bg-[#0f211d] text-white font-display font-600 text-sm px-5 py-2.5 rounded-full transition-colors">
      Build site
    </button>
  `;
}

function launchSite(clinicId) {
  const btn = document.getElementById(`launch-btn-${clinicId}`);
  btn.disabled = true;
  btn.textContent = "Building… (this can take a minute)";
  // Purely cosmetic delay so the interaction still feels like a build step.
  setTimeout(() => {
    const siteUrl = document.getElementById(`launch-siteurl-${clinicId}`).value.trim() || `https://${clinicId}.example.com`;
    state.sitesRegistry[clinicId] = {
      built: true,
      last_built_at: new Date().toISOString(),
      site_url: siteUrl,
    };
    showToast("Site built successfully.");
    const badgeEl = document.getElementById(`site-badge-${clinicId}`);
    if (badgeEl) {
      // Superadmin clinics list — refresh just the badge.
      const clinic = state.clinics.find(c => c.id === clinicId);
      if (clinic) refreshSiteBadge(clinic);
    } else if (state.tab === "website") {
      // Clinic admin's own website tab — re-render the whole panel.
      renderWebsite(clinicId);
      return; // panel (and its button) was replaced, nothing left to reset below
    }
    btn.disabled = false;
    btn.textContent = "Build site";
  }, 900);
}

/* =========================================================================
   CLINIC ADMIN: OVERVIEW
   ========================================================================= */
function renderOverview() {
  const services = state.services;
  let totalAppointments = 0, requested = 0;
  for (const svc of services) {
    const appts = state.appointmentsByService[svc.id] || [];
    totalAppointments += appts.length;
    requested += appts.filter(a => a.status === "requested").length;
  }
  const keys = state.keys;

  document.getElementById("view-root").innerHTML = `
    <h1 class="font-display font-700 text-2xl text-ink mb-6">Overview</h1>
    <div class="grid sm:grid-cols-3 gap-4">
      ${statCard("Services", services.length)}
      ${statCard("Appointments (total)", totalAppointments)}
      ${statCard("Awaiting confirmation", requested)}
    </div>
    <div class="grid sm:grid-cols-2 gap-4 mt-4">
      ${statCard("Active API keys", keys.filter(k => k.is_active).length)}
      ${statCard("Clinic ID", state.me.clinic_id || "—", true)}
    </div>
  `;
}

function statCard(label, value, mono = false) {
  return `
    <div class="bg-surface border border-line rounded-2xl p-5">
      <p class="text-xs text-inksoft font-medium mb-1">${label}</p>
      <p class="${mono ? "font-mono text-sm" : "font-display font-700 text-2xl"} text-ink">${value}</p>
    </div>
  `;
}

/* =========================================================================
   CLINIC ADMIN: APPOINTMENTS
   ========================================================================= */
function renderAppointments() {
  const services = state.services;
  const root = document.getElementById("view-root");
  root.innerHTML = `
    <h1 class="font-display font-700 text-2xl text-ink mb-6">Appointments</h1>
    <select id="appt-service-select" class="rounded-lg border border-line px-3 py-2 text-sm mb-4">
      ${services.map(s => `<option value="${s.id}">${s.name}</option>`).join("")}
    </select>
    <div id="appt-list" class="grid gap-3"></div>
  `;
  if (!services.length) {
    root.innerHTML += `<p class="text-sm text-inksoft mt-2">No services yet — create one in the Services tab first.</p>`;
    return;
  }
  document.getElementById("appt-service-select").addEventListener("change", (e) => loadAppointmentsFor(e.target.value));
  loadAppointmentsFor(services[0].id);
}

function loadAppointmentsFor(serviceId) {
  const list = document.getElementById("appt-list");
  const appts = state.appointmentsByService[serviceId] || [];
  if (!appts.length) {
    list.innerHTML = `<p class="text-sm text-inksoft">No appointments for this service yet.</p>`;
    return;
  }
  list.innerHTML = appts.map(a => appointmentCardHTML(a, serviceId)).join("");
}

function appointmentCardHTML(a, serviceId) {
  const badgeClass = a.status === "confirmed" ? "badge-ok" : a.status === "cancelled" ? "badge-off" : "badge-warn";
  return `
    <div class="bg-surface border border-line rounded-xl p-4 flex items-center justify-between flex-wrap gap-3">
      <div>
        <p class="text-sm font-medium text-ink">${new Date(a.start_time).toLocaleString()}</p>
        <p class="text-xs text-inksoft">appointment ${a.id}</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge ${badgeClass}">${a.status}</span>
        ${a.status === "requested" ? `<button onclick="confirmAppt('${serviceId}','${a.id}')" class="text-xs font-medium text-teal hover:underline">Confirm</button>` : ""}
        ${a.status === "confirmed" ? `<button onclick="cancelAppt('${serviceId}','${a.id}')" class="text-xs font-medium text-red-600 hover:underline">Cancel</button>` : ""}
      </div>
    </div>
  `;
}

function confirmAppt(serviceId, apptId) {
  const appt = (state.appointmentsByService[serviceId] || []).find(a => a.id === apptId);
  if (appt) appt.status = "confirmed";
  showToast("Appointment confirmed.");
  loadAppointmentsFor(serviceId);
}
function cancelAppt(serviceId, apptId) {
  const appt = (state.appointmentsByService[serviceId] || []).find(a => a.id === apptId);
  if (appt) appt.status = "cancelled";
  showToast("Appointment cancelled.");
  loadAppointmentsFor(serviceId);
}

/* =========================================================================
   CLINIC ADMIN: SERVICES
   ========================================================================= */
function renderServices() {
  const services = state.services;
  document.getElementById("view-root").innerHTML = `
    <h1 class="font-display font-700 text-2xl text-ink mb-6">Services</h1>
    <div class="grid sm:grid-cols-2 gap-4">
      ${services.map(s => `
        <div class="bg-surface border border-line rounded-2xl p-5">
          <p class="font-display font-600 text-ink">${s.name}</p>
          <p class="text-sm text-inksoft mt-1">${s.description || ""}</p>
          <p class="text-xs text-inksoft font-mono mt-2">${s.category} · ${s.duration_minutes || 30}min · $${s.price ?? "—"}</p>
        </div>
      `).join("") || `<p class="text-sm text-inksoft">No services yet.</p>`}
    </div>
  `;
}

/* =========================================================================
   CLINIC ADMIN: API KEYS
   ========================================================================= */
function renderKeys() {
  const clinicId = state.me.clinic_id;
  const keys = state.keys;
  document.getElementById("view-root").innerHTML = `
    <div class="flex items-end justify-between mb-6">
      <h1 class="font-display font-700 text-2xl text-ink">API Keys</h1>
      <button onclick="createKey()" class="bg-gold hover:bg-[#d1922f] text-ink font-display font-600 text-xs px-4 py-2 rounded-full transition-colors">
        + New key
      </button>
    </div>
    <div class="grid gap-3">
      ${keys.map(k => `
        <div class="bg-surface border border-line rounded-xl p-4 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p class="text-sm font-mono text-ink">${k.public_key}</p>
            <p class="text-xs text-inksoft">${k.label || "unlabeled"} · ${k.environment}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="badge ${k.is_active ? "badge-ok" : "badge-off"}">${k.is_active ? "active" : "revoked"}</span>
            ${k.is_active ? `<button onclick="revokeKey('${clinicId}','${k.id}')" class="text-xs font-medium text-red-600 hover:underline">Revoke</button>` : ""}
          </div>
        </div>
      `).join("") || `<p class="text-sm text-inksoft">No API keys yet — create one to enable public booking and site generation.</p>`}
    </div>
  `;
}

function createKey() {
  const label = prompt("Label for this key (optional):", "Website widget") || undefined;
  const key = {
    id: uid("key"),
    public_key: `pk_live_${Math.random().toString(16).slice(2, 14)}`,
    label: label || null, environment: "live", is_active: true,
  };
  state.keys.push(key);
  showToast("Key created.");
  renderKeys();
}
function revokeKey(clinicId, keyId) {
  if (!confirm("Revoke this key? Anything using it will stop working immediately.")) return;
  const key = state.keys.find(k => k.id === keyId);
  if (key) key.is_active = false;
  showToast("Key revoked.");
  renderKeys();
}

/* =========================================================================
   CLINIC ADMIN: WEBSITE (launch / rebuild own site)
   ========================================================================= */
function renderWebsite(clinicId) {
  const status = state.sitesRegistry[clinicId] || { built: false };
  const root = document.getElementById("view-root");
  root.innerHTML = `
    <h1 class="font-display font-700 text-2xl text-ink mb-6">Website</h1>
    <div class="bg-surface border border-line rounded-2xl p-6 max-w-xl">
      <div class="mb-4">
        <span class="badge ${status.built ? "badge-ok" : "badge-off"}">
          ${status.built ? "live · built " + new Date(status.last_built_at).toLocaleString() : "not built yet"}
        </span>
        ${status.site_url ? `<a href="${status.site_url}" target="_blank" class="ml-2 text-sm text-teal hover:underline">${status.site_url}</a>` : ""}
      </div>
      <div id="website-form"></div>
    </div>
  `;
  document.getElementById("website-form").innerHTML = launchFormHTML(clinicId);
}

/* =========================================================================
   ACCOUNT — update the signed-in user's own profile. Nothing here is sent
   anywhere; it just edits state.me in place. Only checks that the required
   fields aren't empty, and that the two password fields match.
   ========================================================================= */
function renderAccount() {
  const me = state.me;
  document.getElementById("view-root").innerHTML = `
    <h1 class="font-display font-700 text-2xl text-ink mb-6">Account</h1>
    <div class="bg-surface border border-line rounded-2xl p-6 max-w-lg">
      <label class="block text-xs font-medium text-inksoft mb-1.5">Display name</label>
      <input id="account-name" type="text" value="${me.username || ""}"
        class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

      <label class="block text-xs font-medium text-inksoft mb-1.5">Email</label>
      <input id="account-email" type="email" value="${me.email || ""}"
        class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

      <div class="h-px bg-line my-5"></div>

      <p class="text-xs font-medium text-inksoft mb-3">Change password <span class="text-inksoft/70 font-normal">(optional)</span></p>

      <label class="block text-xs font-medium text-inksoft mb-1.5">New password</label>
      <input id="account-password" type="password" autocomplete="new-password"
        class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

      <label class="block text-xs font-medium text-inksoft mb-1.5">Confirm new password</label>
      <input id="account-password-confirm" type="password" autocomplete="new-password"
        class="w-full rounded-lg border border-line px-3.5 py-2.5 text-sm mb-5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary" />

      <p id="account-error" class="text-sm text-red-600 mb-3 hidden"></p>

      <button onclick="saveAccount()"
        class="bg-ink hover:bg-[#0f211d] text-white font-display font-600 text-sm px-5 py-2.5 rounded-full transition-colors">
        Save changes
      </button>
    </div>
  `;
}

function saveAccount() {
  const name = document.getElementById("account-name").value.trim();
  const email = document.getElementById("account-email").value.trim();
  const password = document.getElementById("account-password").value;
  const passwordConfirm = document.getElementById("account-password-confirm").value;
  const errEl = document.getElementById("account-error");
  errEl.classList.add("hidden");

  if (!name || !email) {
    errEl.textContent = "Display name and email are required.";
    errEl.classList.remove("hidden");
    return;
  }
  if (password || passwordConfirm) {
    if (password !== passwordConfirm) {
      errEl.textContent = "New password and confirmation don't match.";
      errEl.classList.remove("hidden");
      return;
    }
  }

  state.me.username = name;
  state.me.email = email;
  document.getElementById("user-email").textContent = email;
  document.getElementById("account-password").value = "";
  document.getElementById("account-password-confirm").value = "";
  showToast(password ? "Account and password updated." : "Account updated.");
}
</script>

</body>
</html>
